  GroupedFlagsIgnoreAccess: true
  # 这些是分组标志，因此使用 /res pset 昵称 redstone true 时，玩家将获得列表中的所有标志，设置为 false 或移除时同理。
  GroupedFlags:
    redstone:
      - note
      - button
      - diode
      - lever
      - pressure
    crafting:
      - brew
      - enchant
      - table
    # 这组标志将用于 padd 子命令
    trusted:
      - animalkilling
      - beacon
      - build
      - chat
      - container
      - destroy
      - harvest
      - hook
      - leash
      - mobkilling
      - move
      - riding
      - shear
      - tp
      - trade
      - use
      - vehicledestroy
    fire:
      - firespread
      - ignite
  # 完全禁用定义的标志，即使使用 resadmin 命令也无法再访问
  # 如果你不希望为特定标志使用特定检查，可以节省部分服务器处理资源
  TotalFlagDisabling:
    - Completely
    - Disable
    - Particular
    - Flags
  # 提供你想要允许或阻止的命令列表
  # 这是在为全局/世界标志使用 'command: false' 标志时生效
  # 例如在允许部分添加 'res create'，而 '*' 将阻止除 'res create' 以外的所有命令
  # 可以像世界标志一样按世界定义
  # 这不适用于领地内部。领地内的命令限制基于领地的 command 标志及其设置的命令限制
  # 领地本身需要设置 'command: false' 才能用该领地特定的命令限制覆盖全局命令限制
  CommandLimits:
    Global:
      # 启用后，领地内允许和阻止的命令将从全局列表继承，并与领地命令限制合并
      Inherit: false
      WhiteList:
        - some allowed command
      BlackList:
        - some blocked command
# 你可以在此处创建黑名单 / 白名单
ItemList:
  # 列表名称不重要，只要唯一即可。建议使用描述性名称。
  DefaultList:
    # 列表类型，可以是黑名单（blacklist）、白名单（whitelist）或忽略列表（ignorelist）
    Type: blacklist
    # 如果需要，你可以让此列表仅应用于一个世界，否则它将应用于所有世界
    # World: world
    # 你也可以让列表仅应用于一个分组，否则它将应用于所有分组
    # Group: default
    # 这是该列表允许或禁止的材质名称列表
    # 你可以通过输入 /res material <id> 在游戏中按物品 ID 查找材质名称
    # 或者，你也可以直接在列表中使用物品 ID，但这样不够直观，难以一眼看出列表允许或禁止的内容
    Items:
      - LAVA
      - WATER
      - STATIONARY_LAVA
      - STATIONARY_WATER
