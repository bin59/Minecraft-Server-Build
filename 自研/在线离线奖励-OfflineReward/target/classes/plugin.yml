name: OfflineReward
version: 1.1.3
main: com.nangua.offlinereward.OfflineReward
api-version: 26.3
authors:
  - 南瓜服
description: 在线/离线奖励 - 按在线、离线时长发南瓜币到南瓜邮箱（复用 PumpkinMail）
softdepend:
  - PumpkinMail
  - Vault
commands:
  offlinereward:
    description: 在线/离线奖励管理
    usage: /offlinereward [reload|check <玩家>]
    aliases:
      - offr
    permission: offlinereward.admin
permissions:
  offlinereward.admin:
    description: 在线/离线奖励管理（重载/查看）
    default: op
  offlinereward.exempt:
    description: 显式设为 true 时豁免在线 + 离线奖励（不发放）
    default: false
