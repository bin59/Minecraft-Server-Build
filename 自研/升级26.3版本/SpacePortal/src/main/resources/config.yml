# ═══════════════════════════════════════════
#  空间传送阵 SpacePortal 配置文件
# ═══════════════════════════════════════════

# 每次传送消耗的钻石数量
cost-diamonds: 5

# 每个玩家最多可创建的传送阵数量（0 = 禁止玩家自建，-1 = 不限制）
player-portal-limit: 1

# 创造/旁观模式玩家是否免费（方便管理员测试）
free-in-creative: true

# 地面阵法特效的半径（格），越大越壮观，粒子越多
portal-radius: 3.0

# 玩家走进该半径（水平，格）即触发传送流程
activate-radius: 2.2

# 充能蓄力时长（tick，20 = 1 秒），期间移动会取消
charge-ticks: 60

# 传送落地后的"时光穿梭"特效时长（tick）
tunnel-ticks: 50

# 一次传送完成后的冷却秒数，防止落地立刻再次触发
cooldown-seconds: 5

# 地面阵法粒子特效的刷新间隔（tick）
# 越小越流畅、越大越省性能：2 = 每秒 10 帧（华丽但吃性能），4 = 每秒 5 帧（推荐），
# 6 = 每秒约 3 帧（低配服务器），10 = 每秒 2 帧（极省）。修改后 /csz reload 即可生效。
particle-interval-ticks: 4

# 特效可见距离（格）：只有该范围内有玩家时才会发送粒子包
# 建议不要超过客户端实际粒子渲染距离，否则白白发包玩家也看不见
render-distance: 24.0

# ═══════════════════════════════════════════
#  随行实体传送（坐骑 / 宠物）
# ═══════════════════════════════════════════

# 是否允许玩家的坐骑（当前骑着的实体）和属于本人的已驯服宠物一起传送
# 关闭后仍只传送玩家本人
entity-follow-enabled: true

# 自动检测宠物随行的半径（水平，格）：该范围内属于玩家本人的已驯服宠物会一起传送
pet-follow-radius: 3.0

# 每个随行实体额外消耗的钻石（0 = 不额外收费，只收基础传送费）
cost-per-entity: 5

# ═══════════════════════════════════════════
#  界面显示
# ═══════════════════════════════════════════

# 是否在传送阵 GUI / 列表里向玩家显示阵法精确坐标（X,Y,Z）
# true  = 显示坐标（方便玩家定位）
# false = 隐藏坐标（仅显示世界名与目的地，保护阵法位置，防抄家/踩点）
show-coordinates: false
# ═══════════════════════════════════════════
#  特效总开关 / 特殊物品标记
# ═══════════════════════════════════════════

# 是否启用全部视觉 / 听觉特效（地面法阵粒子、充能与爆发粒子、时光隧道、所有音效）
# false = 全部关闭（默认）：不启动粒子任务，不发送任何粒子包或音效包
# true  = 恢复原有完整特效
effects-enabled: false

# 关闭特效后，用「特殊物品」作为传送阵的可见标记
# 插件在每个阵法中心上方生成一个 Item Display 展示实体：
# 无碰撞、不可拾取、静态、不写存档，不产生任何粒子 / 音效 / 周期网络包
display-item:
  # 展示实体类型：
  # ITEM_DISPLAY = 默认，Java 端最干净（无碰撞、不写存档），需 1.19.4+
  # ARMOR_STAND  = 隐形 marker 盔甲架头顶戴物品，Geyser 全版本支持，基岩端也能看到
  mode: ITEM_DISPLAY
  # 是否显示物品标记（true = 用物品代替粒子法阵）
  enabled: true
  # 悬浮高度（格，相对阵法中心）
  height: 1.2
  # 展示朝向：CENTER / FIXED / VERTICAL / HORIZONTAL
  billboard: CENTER
  # 默认展示物品。管理员可用 /csz item set 把手持物品整体替换，
  # 支持附魔、自定义模型、任意数据组件的特殊物品（序列化存进 override.yml）
  material: ECHO_SHARD
  name: "&d✦ 空间传送阵"
  # 是否把该物品当作「传送凭证」：
  # true  = 玩家必须主手持有同材质 / 同名的物品才能启动阵法
  # false = 仅作静态标记，踩阵传送逻辑不变
  use-as-trigger: false
