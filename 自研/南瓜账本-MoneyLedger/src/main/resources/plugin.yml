name: MoneyLedger
version: 1.1.0
main: com.nangua.moneyledger.MoneyLedger
api-version: 26.3
authors:
  - 南瓜服
description: 南瓜账本 - 南瓜币变动全量流水（事件同步落盘 + Essentials trade.log 幂等回填 + 对账）
commands:
  moneyledger:
    description: 南瓜币流水查询、回填与对账
    usage: /moneyledger <recent|summary|export|stats|backfill|verify>
    aliases:
      - moneylog
permissions:
  moneyledger.admin:
    description: 南瓜账本管理（查看/导出流水、trade.log 回填、对账）
    default: op
