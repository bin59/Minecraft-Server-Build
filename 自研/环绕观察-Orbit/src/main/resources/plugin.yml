name: Orbit
version: '1.0.1'
main: com.nangua.orbit.OrbitPlugin
api-version: '26.3'
author: 南瓜
description: 环绕镜头观察与定时巡视
commands:
  orbit:
    description: 环绕观察玩家
    usage: /orbit <玩家> | /orbit stop | /orbit reload | /orbit tour <start|stop|status>
permissions:
  orbit.use:
    description: 允许使用 /orbit <玩家>
    default: op
  orbit.admin:
    description: 允许 reload 与手动巡视
    default: op
  orbit.bypass:
    description: 不被自动巡视选中
    default: false
