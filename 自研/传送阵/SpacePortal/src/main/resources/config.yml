# ═══════════════════════════════════════════
#  空间传送阵 SpacePortal 配置文件
# ═══════════════════════════════════════════

# 每次传送消耗的钻石数量
cost-diamonds: 5

# 每个玩家最多可创建的传送阵数量（0 = 禁止玩家自建，-1 = 不限制）
player-portal-limit: 1

# 创造/旁观模式玩家是否免费（方便管理员测试）
free-in-creative: true

# 地面阵法特效的半径（格），越大越壮观，粒子越多
portal-radius: 3.0

# 玩家走进该半径（水平，格）即触发传送流程
activate-radius: 2.2

# 充能蓄力时长（tick，20 = 1 秒），期间移动会取消
charge-ticks: 60

# 传送落地后的"时光穿梭"特效时长（tick）
tunnel-ticks: 50

# 一次传送完成后的冷却秒数，防止落地立刻再次触发
cooldown-seconds: 5

# 地面阵法粒子特效的刷新间隔（tick）
# 越小越流畅、越大越省性能：2 = 每秒 10 帧（华丽但吃性能），4 = 每秒 5 帧（推荐），
# 6 = 每秒约 3 帧（低配服务器），10 = 每秒 2 帧（极省）。修改后 /csz reload 即可生效。
particle-interval-ticks: 4

# 特效可见距离（格）：只有该范围内有玩家时才会发送粒子包
# 建议不要超过客户端实际粒子渲染距离，否则白白发包玩家也看不见
render-distance: 24.0
