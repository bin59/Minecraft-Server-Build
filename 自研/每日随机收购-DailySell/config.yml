# DailySell 每日随机收购配置（8 种选 5 种）
# 每天零点从 pool 随机抽 items-per-day 种物品，作为全服共享的"今日候选清单"：
#   - 每种当天额度随机 [min-per-item, max-per-item] 个（每人当天最多卖这么多个）
#   - 每种单价 = 基础价 × 当日随机浮动系数（price-float-min ~ price-float-max），取整
#   - 生成时保证 8 种合计（单价×额度）不超过 daily-budget（默认 900），超了自动缩减额度
# 每位玩家用 /ds choose 从今日 8 种里自选 5 种，只有选中的 5 种可以出售；
# 选择按日期存在 data.yml 的 choices 段，重登 / 重启不变，跨天自动失效需重选。
# 玩家 /ds sell（卖1个）/ /ds sellall（卖满额度）获得南瓜币；每人每天每种额度上限 + 总收益上限 = 防刷。
# 重载: /ds reload（不重抽）| /ds reroll（重新生成今日清单）| /ds choose <序号|clear>

# 每天随机几种（今日候选清单，全服共享）
items-per-day: 8

# 每人每天从今日清单里自选几种作为自己的可卖清单
# 基岩端用 /ds choose <1-8> 按序号选择，Java 端还可直接点选择界面
choices-per-day: 5

# 每种每日额度随机范围（个）
# 8 种清单时额度会自动分摊；60 个/种可保证 800 币预算内稳定生成
min-per-item: 10
max-per-item: 60

# 当日单价浮动系数（基础价 × [min, max]）
price-float-min: 0.6
price-float-max: 1.4

# 每人每日收购总收益上限（南瓜币，防刷 Faucet 封顶）
daily-budget: 900

# 生成/跨天时是否全服广播今日清单
broadcast: true

# 物品池（110 种）：Material 名（不区分大小写）: 基础收购价（南瓜币）
# 按类别分组；新增种类基础价 1~20 币，daily-budget 800 币不变，6 种额度自动分摊
# 当日实价 = 基础价 × 随机浮动系数，管理员可按服务器经济状况调价
