name: PumpkinFly
version: 1.0.0
main: com.nangua.pumpkinfly.PumpkinFlyPlugin
api-version: '26.3'
author: nangua
description: 南瓜飞 - 永久/限时飞行、限时体验奖励、全局与单人飞行管理、飞行区域控制
depend: [Vault]
softdepend: [Residence, Essentials, QuickMenu, PlaceholderAPI]

commands:
  pfly:
    description: 南瓜飞主命令（时长支持 30m / 2h / 3d / 1d2h30m，纯数字按分钟）
    usage: /pfly <buy|claim|on|off|toggle|hud|status|records|trial|global|player|give|take|setperm|reload>
    aliases: [pumpkinfly, pf]

permissions:
  pumpkinfly.use:
    description: 允许使用 /pfly 查看状态与开关飞行
    default: true
  pumpkinfly.buy:
    description: 允许用南瓜币购买飞行时长 / 永久飞行
    default: true
  pumpkinfly.records:
    description: 允许查看自己的购买与飞行记录
    default: true
  pumpkinfly.admin:
    description: 允许 give/take/setperm/reload、限时体验发放、全局与单人飞行管理、查看他人状态与记录
    default: op
  pumpkinfly.bypass:
    description: 绕过区域、余额与 Essentials 门禁（管理员调试用）
    default: op
  pumpkinfly.*:
    description: 全部权限
    default: op
    children:
      pumpkinfly.use: true
      pumpkinfly.buy: true
      pumpkinfly.records: true
      pumpkinfly.admin: true
      pumpkinfly.bypass: true
