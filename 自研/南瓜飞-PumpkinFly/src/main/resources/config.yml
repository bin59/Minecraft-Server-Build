# ============================================================
# PumpkinFly 南瓜飞 - 主配置
# 替换 jar 后重启生效；本文件已存在时不会被覆盖，新增键在代码里有默认值。
# ============================================================

# ---------- 价格 ----------
prices:
  # 永久飞行价格（南瓜币）。永久只免扣时，仍受 zones 区域规则限制
  permanent: 100000
  # 每 1 分钟价格
  per-minute: 100
  # 单次最多购买分钟数（防止误输入把余额清空）。仅普通玩家受限；
  # 持有 pumpkinfly.admin 的管理员不受此上限约束，可随意购买。
  # 当前 120 = 2 小时（玩家单次任何方式最多买 2 小时）。
  max-minutes-per-buy: 120
  # 余额上限（分钟），购买时不允许超过。管理员（pumpkinfly.admin）同样不受此约束。
  max-balance-minutes: 10080
  # 是否允许重复购买永久（false = 已永久时拒绝再扣款）
  allow-duplicate-permanent: false

# ---------- 计时 ----------
timing:
  # FLYING_ONLY = 仅在真正飞行中（isFlying）扣秒，站着/跑步/离线都不扣（本服采用）
  # REAL_TIME   = 购买后按现实时间倒计时，离线也走
  mode: FLYING_ONLY
  # 主循环间隔（秒），一般保持 1
  tick-seconds: 1
  # 余额剩多少秒时提醒（仅限时飞行）
  warn-seconds: [60, 30, 10]
  # 是否对永久飞行也记录会话与开启时间
  track-permanent-sessions: true

# ---------- 允许飞行的区域（核心） ----------
zones:
  # 判定模式：
  #   OWN_AND_MAIN   自己的领地 + main-residences 列出的主城领地（默认，推荐）
  #   ALL_RESIDENCES 任意 Residence 领地内均可飞（含他人领地）
  #   WHITELIST      仅 residence-whitelist 列出的领地 + 可选野外世界
  #   EVERYWHERE     不限制区域（仍要求有有效凭证）
  mode: OWN_AND_MAIN

  # 主城领地名称（Residence 领地名，本服实为 zhucheng）
  main-residences: [zhucheng]

  # OWN_AND_MAIN 模式下的细分开关
  allow-own-residences: true # 玩家自己拥有的领地
  allow-trusted-residences: false # 玩家被信任的他人领地
  allow-other-residences: false # 其它任意领地

  # 野外（不在任何领地内）
  allow-wilderness: false
  wilderness-worlds: [] # 单独放行某些世界的野外，例如 [world]

  # 领地名单（WHITELIST 用；黑名单对所有模式生效）
  residence-whitelist: []
  residence-blacklist: []

  # 世界过滤：world-whitelist 非空时只允许列出的世界；blacklist 优先
  world-whitelist: []
  world-blacklist: [world_nether, world_the_end]

  # Residence 未安装时的兜底：true=全部按野外规则处理，false=视为允许
  when-residence-missing: WILDERNESS

# ---------- 安全与边界 ----------
safety:
  # 关闭飞行时向下寻找落脚点，避免半空摔死
  safe-land: true
  search-depth: 32
  # 关飞后多少秒内免疫摔落伤害
  no-fall-damage-seconds: 5
  # 换世界 / 换游戏模式时立即结束会话并重新判定
  disable-on-world-change: true
  disable-on-gamemode-change: true
  # 离开允许区域时发送提示（每秒判定，内部有节流）
  notify-on-leave-zone: true

# ---------- 本地数据存储 ----------
storage:
  # 定时落盘间隔（秒）；购买、给与、退出、关服会立即落盘
  save-interval-seconds: 60
  # 每个记录文件最多保留多少条，超出裁剪最旧的
  max-records-per-file: 5000
  record-purchases: true
  record-sessions: true
  # 玩家昵称是否随登录更新
  update-name-on-join: true

# ---------- 与其它插件协作 ----------
integration:
  # 监听 Essentials FlyStatusChangeEvent，堵住 /fly、/efly、/essentials:fly 绕过区域限制
  block-essentials-fly: true
  # 是否在启动时提示检查 Essentials 的 send-fly-enable-on-join / world-change-fly-reset
  warn-essentials-auto-fly: true

# ---------- 全局飞行管理（/pfly global 运行时状态存 data/global.yml） ----------
global:
  # 全服总开关。false = 所有人强制落地且无法起飞（优先级最高）
  # 注意：这里只是 global.yml 不存在时的初值；之后以 /pfly global on|off 的结果为准
  enabled: true
  # 全服免费飞行：所有人无需凭证即可飞（仍受 zones 区域规则限制）
  free-fly: false

# ---------- 限时体验奖励（按现实时间到期，离线也走，不扣时长余额） ----------
rewards:
  # 首次进服自动赠送的体验时长，留空 / 0 = 关闭。例：30m、2h、1d、1d2h30m
  join-trial: ''
  # true = 每个 UUID 只送一次（存 players.yml 的 join-trial-given）
  join-trial-once: true
  # /pfly claim 与快捷菜单「领取体验奖励」按钮发放的时长，留空 / 0 = 关闭
  claim-trial: 30m
  # ONCE = 每人只能领一次；DAILY = 每天可领一次；ALWAYS = 每次点击都发（叠加到期时间）
  claim-mode: ONCE
  # 单次发放上限（天），防止管理员误输入把到期时间顶到几十年后
  max-trial-days: 30

# ---------- 飞行界面显示（不用打 /pfly status 就能看状态） ----------
display:
  # ACTION_BAR = 快捷栏上方文字（默认）；BOSS_BAR = 顶部血条；BOTH = 两个都显示；OFF = 关闭
  # 基岩版 / Geyser 玩家若 ActionBar 看不到，改成 BOTH 或 BOSS_BAR
  mode: ACTION_BAR
  # ENABLED = 有凭证且在允许区域就显示（含「已开飞、等待双击空格」态）
  # FLYING  = 只有真正在飞行时才显示
  show-when: ENABLED
  # 刷新间隔（秒），一般保持 1；ActionBar 需要持续重发否则会淡出
  update-seconds: 1
  # 剩余时间少于此秒数时，剩余数字标红、BossBar 变红
  warn-seconds: 60
  # BossBar 颜色 / 样式（限时飞行临期自动变红，永久飞行显示蓝色）
  bar-color: GREEN
  bar-style: SOLID
  # 是否允许模板里的 {bar} 显示 10 格文本进度条
  show-progress-bar: true

  # 模板占位符：{remaining} 剩余时长（永久显示「永久」，体验显示「体验 x 小时」）
  #             {session} 本次已飞  {total} 累计已飞  {state} 飞行中/待起飞
  #             {zone} 当前区域  {source} 凭证来源  {bar} 10 格进度条
  action-bar-flying: '&a&l[飞行中] &8| &7剩余 &e{remaining} &8| &7本次 &e{session} &8| &7累计 &e{total} &8| {bar}'
  action-bar-idle: '&e&l[飞行可用] &8| &7{source} &8| &7剩余 &e{remaining} &8| &7区域 &e{zone} &8| &e双击空格起飞'
  boss-bar-title: '&6南瓜飞 &8| &f{state} &8| &7剩余 &e{remaining} &8| &7本次 &e{session}'

