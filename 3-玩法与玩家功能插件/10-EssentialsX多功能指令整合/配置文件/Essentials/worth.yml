# 南瓜生存服 · 物品回收价表（worth.yml）
# 2026-09-17 按《经济系统设计手册-防通胀与定价模型》重写
#
# 原则（手册 §4D）：
#   - 可量产物品（铁/金/农作物/原石/钻石等，农场可无限刷）→ 不列入本表 = 无法 /sell，杜绝印钞机
#   - 半稀缺 / 不可量产物品（探险/BOSS 产出）→ 只设"系统买价"（玩家卖给系统），作为价格地板
#   - 系统卖价（价差）由第二阶段商店实现（DeluxeMenus 商店 / 告示牌商店），本表只管回收
#   - 1.13+ 新版物品 ID；未列出的物品无法通过 /sell 出售

worth:
  # 半稀缺：探险产出（末地船 / 深暗古城 / 林地府邸）
  elytra: 2000            # 鞘翅：系统买价 2000（手册 §6）
  totem_of_undying: 750   # 不死图腾：系统买价 750（手册 §6）
  shulker_shell: 150      # 潜影壳：探险半稀缺
  nether_star: 500        # 凋灵之星：BOSS 击杀产出，冷却受限
  dragon_head: 300        # 龙首：末影龙一次性产出
