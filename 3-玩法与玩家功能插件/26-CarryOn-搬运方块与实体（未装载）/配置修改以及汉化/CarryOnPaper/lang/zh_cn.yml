# CarryOnPaper 简体中文语言文件。
# 默认使用 MiniMessage。如需使用 & 颜色代码，请在 config.yml 中将 message-format 改为 legacy。

# 该前缀会加在每条插件消息之前。
prefix: "<gold>CarryOn</gold> <dark_gray>›</dark_gray> "

no-permission: "<red>你没有权限这样做。"
only-players: "<red>只有玩家才能使用该命令。"
reloaded: "<green>配置、语言和声音已重新加载。"
help: "<green>使用 <white>/carryon reload</white> 或 <white>/carryon language [en_us|zh_cn|de-eu|fr_fr|es_es]</white>。潜行并右键点击已配置的方块和生物即可搬运它们。"
unknown-subcommand: "<red>未知子命令。请使用 <white>/carryon help</white>。"
language-usage: "<red>用法: <white>/carryon language [en_us|zh_cn|de-eu|fr_fr|es_es]</white>"
language-changed: "<green>语言已切换为 <white>%language%</white>。"
pickup-block: "<green>已拾起 <white>%name%</white>。"
place-block: "<green>已放置 <white>%name%</white>。"
pickup-entity: "<green>已拾起 <white>%name%</white>。"
place-entity: "<green>已放置 <white>%name%</white>。"
cannot-carry: "<red>你无法搬运这个。"
already-carrying: "<red>你已经在搬运某样东西了。"
carry-limit-reached: "<red>你无法同时搬运超过 <white>%limit%</white> 个物品。"
