# DO NOT EDIT THIS VALUE!
config-version: 19

# 以下可在任意消息中使用的占位符。
# 例如：在下方添加 'PREFIX: "[决斗]"'，然后在消息里写 '{PREFIX}'，游戏内就会显示 [决斗]。
STRINGS:
  PREFIX: '&9[决斗]'
  LINE: '&9&m------------------------------------&r'
  HALF_LINE: '&9&m----------------&r'
  FAIL_PREFIX: '&c开启对战失败：'


GENERAL:
  true: '&a开启'
  false: '&c关闭'
  enabled: '&a已启用'
  disabled: '&c已禁用'
  not-selected: '未选择'
  random: '随机'
  none: '无'
  unlimited: '无限'
  unknown: '未知'
  kit-selector: '装备选择'
  arena-selector: '竞技场选择'
  item-betting: '物品押注'
  betting: '押注'
  cancelled: '{PREFIX} &e操作已取消。'


ERROR:
  no-permission: '{PREFIX} &c不行！你缺少权限：''%permission%'''
  data:
    load-failure: '{PREFIX} &c无法加载你的决斗数据，请重新登录。'
    not-loaded: '{PREFIX} &c玩家数据仍在加载中，请稍后再试。'
    not-found: '{PREFIX} &c%name% 暂无决斗数据。'
  top:
    no-data-available: '{PREFIX} &c暂无可用数据。'
  player:
    not-found: '{PREFIX} &c%name% 不在线。'
    no-longer-online: '{PREFIX} &c该玩家已下线。'
  arena:
    not-found: '{PREFIX} &c不存在名为 ''%name%'' 的竞技场。'
    already-exists: '{PREFIX} &c已存在名为 ''%name%'' 的竞技场。'
    delete-failure: '{PREFIX} &c无法删除正在使用的竞技场。请先用 ''/duels toggle %name%'' 停用它。'
    invalid-position: '{PREFIX} &c位置必须是 1 或 2。'
    no-position-set: '{PREFIX} &c竞技场 ''%name%'' 尚未设置出生点。'
    empty-hand: '{PREFIX} &c你必须手持物品才能使用此命令。'
  kit:
    not-found: '{PREFIX} &c不存在名为 ''%name%'' 的装备。'
    already-exists: '{PREFIX} &c已存在名为 ''%name%'' 的装备。'
    empty-hand: '{PREFIX} &c你必须手持物品才能使用此命令。'
  customkits:
    limit-reached: '{PREFIX} &c你已达到自定义装备上限 &e%limit%&c。'
    name-empty: '{PREFIX} &c装备名不能为空。'
    name-too-short: '{PREFIX} &c装备名至少要 &e%min% &c个字符。'
    name-too-long: '{PREFIX} &c装备名不能超过 &e%max% &c个字符。'
    name-no-spaces: '{PREFIX} &c装备名不能含空格。'
    name-invalid-chars: '{PREFIX} &c装备名含非法字符。'
    name-duplicate: '{PREFIX} &c你已经有一个名为 ''&e%name%&c'' 的自定义装备。'
    not-found: '{PREFIX} &c未找到自定义装备 ''&e%name%&c''。'
    material-blocked: '{PREFIX} &c物品 ''&e%material%&c'' 不允许用于自定义装备。'
    material-not-allowed: '{PREFIX} &c物品 ''&e%material%&c'' 不允许用于自定义装备。'
    invalid-amount: '{PREFIX} &c物品数量无效。'
    enchantment-blocked: '{PREFIX} &c附魔 ''&e%enchantment%&c'' 不允许使用。'
    enchantment-incompatible: '{PREFIX} &c附魔 ''&e%enchantment%&c'' 无法用于 ''&e%item%&c''。'
    enchantment-level-too-high: '{PREFIX} &c附魔 ''&e%enchantment%&c'' 等级超过上限（&e%max%&c）。'
    too-many-attributes: '{PREFIX} &c物品属性修饰过多（上限：&e%max%&c）。'
    attribute-amount-invalid: '{PREFIX} &c属性 &e%attribute% &c的数值必须在 &e%min% &c到 &e%max%&c 之间。'
    kit-null: '{PREFIX} &c自定义装备无效。'
    invalid-armor-slot: '{PREFIX} &c物品 ''&e%material%&c'' 不能装备到 &e%slot% &c栏位。'
    potion-not-extendable: '{PREFIX} &c这种药水不能延长时间。'
    potion-not-upgradeable: '{PREFIX} &c这种药水不能升级为 II 级。'
    item-betting-disabled: '{PREFIX} &c玩家自创装备的决斗只支持金钱押注，物品押注已禁用。'
  player-only: '{PREFIX} &c此命令只能由玩家使用。'
  duel:
    is-self: '{PREFIX} &c你不能和自己决斗。'
    inventory-not-empty: '{PREFIX} &c使用此命令前必须清空背包。'
    in-creative-mode: '{PREFIX} &c创造模式不能决斗。'
    in-blacklisted-world: '{PREFIX} &c此世界不能决斗。'
    is-tagged: '{PREFIX} &c战斗保护期间不能决斗。'
    in-cooldown: '{PREFIX} &c%name% 还在决斗冷却中，剩余 %time%。'
    not-in-duelzone: '{PREFIX} &c你只能在以下区域决斗：%regions%'
    requests-disabled: '{PREFIX} &c%name% 当前不接受决斗请求。'
    already-has-request: '{PREFIX} &c你已经向 %name% 发送过请求了。'
    no-request: '{PREFIX} &c你没有来自 %name% 的请求。'
    already-in-match:
      sender: '{PREFIX} &c你正在决斗中，不能这么做。'
      target: '{PREFIX} &c%name% 正在决斗中。'
    mode-unselected: '{PREFIX} &c你必须选择一个装备，或开启自带背包模式。'
    mode-fixed: '{PREFIX} &c你无权关闭自带背包模式。'
    already-spectating:
      sender: '{PREFIX} &c你正在观战中，不能这么做。'
      target: '{PREFIX} &c%name% 正在观战。'
    not-in-match: '{PREFIX} &c%name% 没有在决斗。'
    prevent-teleportation: '{PREFIX} &c你不能传送到这名玩家，他正在决斗。'
  party-duel:
    inventory-not-empty: '{PREFIX} &c你和你的队伍成员必须清空背包才能使用此命令。'
    in-creative-mode: '{PREFIX} &c你或你的队伍成员在创造模式。'
    in-blacklisted-world: '{PREFIX} &c你或你的队伍成员在黑名单世界。'
    is-tagged: '{PREFIX} &c你或你的队伍成员正在战斗保护中。'
    not-in-duelzone: '{PREFIX} &c你或你的队伍成员不在以下任一区域：%regions%'
    already-has-request: '{PREFIX} &c你已经向 %name% 的队伍发送过请求了。'
    no-request: '{PREFIX} &c你没有来自 %name% 队伍的请求。'
    already-in-match:
      sender: '{PREFIX} &c你的队伍正在决斗中，不能这么做。'
      target: '{PREFIX} &c%name% 的队伍正在决斗中。'
    already-spectating:
      sender: '{PREFIX} &c你或你的队伍成员正在观战中。'
      target: '{PREFIX} &c%name% 队伍里有人正在观战。'
    option-unavailable: '{PREFIX} &c队伍决斗暂不支持物品/金钱押注。'
  party:
    is-self: '{PREFIX} &c你不能和自己组队。'
    is-not-owner: '{PREFIX} &c你必须是队长才能这么做。'
    is-owner: '{PREFIX} &c你是队长，不能直接离队。请用 ''/party transfer'' 转让队长，或用 ''/party disband'' 解散队伍。'
    requests-disabled: '{PREFIX} &c%name% 当前不接受队伍邀请。'
    already-has-invite: '{PREFIX} &c你已经向 %name% 发送过邀请了。'
    no-invite: '{PREFIX} &c你没有来自 %name% 的邀请。'
    not-found: '{PREFIX} &c该队伍已不存在。'
    already-in-party:
      sender: '{PREFIX} &c你已经在队伍里了。'
      target: '{PREFIX} &c%name% 已经在队伍里了。'
    not-in-party:
      sender: '{PREFIX} &c你必须先加入队伍。'
      target: '{PREFIX} &c%name% 不在任何队伍。'
    not-a-member: '{PREFIX} &c%name% 不是你队伍的成员。'
    in-same-party: '{PREFIX} &c%name% 就在你的队伍里。'
    kick-self: '{PREFIX} &c你不能把自己踢出队伍。'
    is-not-same-size: '{PREFIX} &c双方队伍人数必须一致。'
    is-not-online:
      sender: '{PREFIX} &c你队伍的所有成员都必须在线！'
      target: '{PREFIX} &c%name% 队伍的所有成员都必须在线！'
    max-size-reached:
      sender: '{PREFIX} &c你的队伍已达人数上限！'
      target: '{PREFIX} &c%name% 的队伍已达人数上限！'
    cannot-friendly-fire: '{PREFIX} &c不允许队友误伤。'
  setting:
    disabled-option: '{PREFIX} &c%option% 当前已禁用。'
    arena-not-applicable: '{PREFIX} &c装备 %kit% 不能用于竞技场 %arena%。'
  inventory-view:
    not-a-uuid: '{PREFIX} &c%input% 不是有效的 UUID。'
    not-found: '{PREFIX} &c不存在 UUID 为 ''%uuid%'' 的存档。'
  queue:
    not-found: '{PREFIX} &c不存在装备 %kit%、押注 $%bet_amount% 的队列。'
    already-exists: '{PREFIX} &c已存在装备 ''%kit%''、押注 $%bet_amount% 的队列。'
    already-in: '{PREFIX} &c你已经在排队了！'
    not-in-queue: '{PREFIX} &c你不在任何队列里。'
    not-enough-money: '{PREFIX} &c加入该队列需要 $%bet_amount%。'
    party-too-large: '{PREFIX} &c你的队伍有 %party_size% 人，但该队列只支持 %team_size% 人一队。'
    no-queues-available: '{PREFIX} &c当前没有可用队列。'
  sign:
    not-a-sign: '{PREFIX} &c你看的方块不是告示牌！'
    not-found: '{PREFIX} &c那个告示牌不是排队牌！'
    already-exists: '{PREFIX} &c那个告示牌已经是排队牌了！要移除请用 ''/duels delsign'''
    cancel-break: '{PREFIX} &c你不能手动破坏排队牌！请用 ''/duels delsign'''
  sound:
    not-found: '{PREFIX} &c不存在名为 ''%name%'' 的音效。'
  command:
    invalid-sub-command: '{PREFIX} &c''%argument%'' 不是有效子命令。输入 ''/%command%'' 查看帮助。'
    invalid-option: '{PREFIX} &c''%option%'' 不是有效选项。可用选项：%available_options%'
    invalid-action: '{PREFIX} &c''%action%'' 不是有效操作。可用操作：%available_actions%'
    not-enough-money: '{PREFIX} &c你没有足够的钱押注！'
    lobby-save-failure: '{PREFIX} &c无法保存大厅位置，请查看控制台。'
    name-not-alphanumeric: '{PREFIX} &c''%name%'' 不是字母数字组合。'
    invalid-argument: "{PREFIX} &c参数无效：{arg}。命令中不允许占位符。"


COMMAND:
  kit:
    usage: '{PREFIX} &c用法：/kit [edit|save|reset] [玩家] [装备名]'
    edit:
      usage: '{PREFIX} &c用法：/kit edit <装备名>'
    reset:
      usage: '{PREFIX} &c用法：/kit reset <装备名> 或 /kit reset <玩家> <装备名>'
    unknown-subcommand: '{PREFIX} &c未知子命令：%subcommand%'
  duel:
    usage:
      - '{LINE}'
      - '&f/%command% [玩家] &e- &7向玩家发送决斗请求。'
      - '&f/%command% [玩家] <金额> &e- &7带押注的决斗请求。'
      - '&f/%command% [accept | deny] [玩家] &e- &7接受或拒绝决斗请求。'
      - '&f/%command% stats <名字> &e- &7查看决斗数据。'
      - '&f/%command% toggle &e- &7开关是否接受决斗请求。'
      - '&f/%command% top [-|wins|losses|kit] &e- &7查看胜场、败场或装备评分排行。'
      - '{LINE}'
    request:
      send:
        sender:
          - '{LINE}'
          - '&7已向 &f%name%&7 发送决斗请求。'
          - '&6- &7装备：&3%kit%'
          - '&6- &7自带背包：&r%own_inventory%'
          - '&6- &7竞技场：&e%arena%'
          - '&6- &7押注：&6$%bet_amount%'
          - '&6- &7物品押注：&r%item_betting%'
          - '{LINE}'
        receiver:
          - '{LINE}'
          - '&7收到来自 &f%name%&7 的决斗请求。'
          - '&6- &7装备：&3%kit%'
          - '&6- &7自带背包：&r%own_inventory%'
          - '&6- &7竞技场：&e%arena%'
          - '&6- &7押注：&6$%bet_amount%'
          - '&6- &7物品押注：&r%item_betting%'
          - '{LINE}'
        clickable-text:
          info:
            text: '&7点击 '
            hover-text: ''
          accept:
            text: '&a&l[接受] '
            hover-text: '&7点击 &a接受 &7此请求。'
          deny:
            text: '&c&l[拒绝]'
            hover-text: '&7点击 &c拒绝 &7此请求。'
      accept:
        sender: '{PREFIX} &f%name% &7已接受你的决斗请求。'
        receiver: '{PREFIX} &7你已接受来自 &f%name%&7 的决斗请求。'
      deny:
        sender: '{PREFIX} &7你发给 &f%name% &7的决斗请求被拒绝了。'
        receiver: '{PREFIX} &7你拒绝了来自 &f%name%&7 的决斗请求。'
    party-request:
      send:
        sender-party:
          - '{LINE}'
          - '&f%owner% &7已向 &f%name% 的队伍&7 发送决斗请求。'
          - '&6- &7装备：&3%kit%'
          - '&6- &7自带背包：&r%own_inventory%'
          - '&6- &7竞技场：&e%arena%'
          - '{LINE}'
        receiver-party:
          - '{LINE}'
          - '&7收到来自 &f%name% 队伍&7 的决斗请求。'
          - '&6- &7装备：&3%kit%'
          - '&6- &7自带背包：&r%own_inventory%'
          - '&6- &7竞技场：&e%arena%'
        clickable-text:
          info:
            text: '&7点击 '
            hover-text: ''
          accept:
            text: '&a&l[接受] '
            hover-text: '&7点击 &a接受 &7此请求。'
          deny:
            text: '&c&l[拒绝]'
            hover-text: '&7点击 &c拒绝 &7此请求。'
          extra:
            text: '{LINE}'
            hover-text: ''
      accept:
        sender-party:
          - '{LINE}'
          - '{PREFIX} &f%name% 的队伍 &7已接受 &f%owner%&7 的决斗请求。'
          - '{LINE}'
        receiver-party:
          - '{LINE}'
          - '{PREFIX} &f%owner% &7已接受来自 &f%name% 队伍&7 的决斗请求。'
          - '{LINE}'
      deny:
        sender-party:
          - '{LINE}'
          - '{PREFIX} &f%name% 的队伍 &7已拒绝 &f%owner%&7 的决斗请求。'
          - '{LINE}'
        receiver-party:
          - '{LINE}'
          - '{PREFIX} &f%owner% &7拒绝了来自 &f%name% 队伍&7 的决斗请求。'
          - '{LINE}'
      preview:
        server-kit: '{PREFIX} &a本次决斗使用服务器装备：&e%kit%'
        own-inventory: '{PREFIX} &a本次决斗使用自带背包。'
    stats:
      displayed:
        - '{LINE}'
        - '&7&f%name% &e的决斗数据：'
        - '&7胜场：&a%wins%'
        - '&7败场：&c%losses%'
        - '&7胜率：&b%wl_ratio%'
        - '&7接受请求：&r%requests_enabled%'
      # 注意：只有在配置里开启 display-kit-ratings 或 display-nokit-rating 才会显示评分。
      rating:
        header: '&7评分 &e-'
        format: '&f%type%&7：&b%rating%'
        footer: ''
      # 注意：只有在配置里开启 display-past-matches 才会显示历史对局。
      match:
        header: '&7最近对局 &e-'
        format: '&a%winner% &f胜 &c%loser% &6[悬停查看]'
        hover-text:
          - '&7装备：&3%kit%'
          - '&7时长：&a%duration%'
          - '&7时间：&f%time% 前'
          - '&7残血：&d%health%❤'
        footer: '{LINE}'
    toggle:
      enabled: '{PREFIX} &a你现在会接受决斗请求。'
      disabled: '{PREFIX} &c你现在不再接受决斗请求。'
    top:
      next-update: '{PREFIX} &7下次更新：&f%remaining%'
      header: '{HALF_LINE} &7胜榜 &f前十 &7%type% {HALF_LINE}'
      display-format: '&e%rank%. &f%name% &e- &f%score% &7%identifier%'
      footer: '{HALF_LINE} &7胜榜 &f前十 &7%type% {HALF_LINE}'

  duels:
    usage:
      - '{LINE}'
      - '&f/%command% help &e- &7显示本页。'
      - '&f/%command% help arena &e- &7显示竞技场命令列表。'
      - '&f/%command% help kit &e- &7显示装备命令列表。'
      - '&f/%command% help queue &e- &7显示队列命令列表。'
      - '&f/%command% help sign &e- &7显示告示牌命令列表。'
      - '&f/%command% help user &e- &7显示玩家数据编辑命令。'
      - '&f/%command% help extra &e- &7显示其他命令。'
      - '{LINE}'
    help:
      arena:
        - '{HALF_LINE} &f竞技场命令 {HALF_LINE}'
        - '&f/%command% create [名字] &e- &7创建一个竞技场。'
        - '&f/%command% set [名字] [1|2] &e- &7设置竞技场的传送点。'
        - '&f/%command% delete [名字] &e- &7删除竞技场。'
        - '&f/%command% setarenaitem [名字] &e- &7设置该竞技场在菜单里的展示物品。'
        - '&f/%command% info [名字] &e- &7查看该竞技场信息。'
        - '&f/%command% toggle [名字] &e- &7启用/停用竞技场。'
        - '&f/%command% tp [名字] <1|2> &e- &7传送到该竞技场。'
        - '&f/%command% list &e- &7列出所有竞技场。'
        - '{HALF_LINE} &f竞技场命令 {HALF_LINE}'
      kit:
        - '{HALF_LINE} &f装备命令 {HALF_LINE}'
        - '&f/%command% savekit <-o> [名字] &e- &7保存一个装备。'
        - '&f/%command% loadkit [名字] &e- &7把选中的装备载入背包。'
        - '&f/%command% kitgive [装备] [玩家] &e- &7把装备发给玩家。'
        - '&f/%command% deletekit [名字] &e- &7删除装备。'
        - '&f/%command% setitem [名字] &e- &7设置该装备在菜单里的展示物品。'
        - '&f/%command% options [装备] &e- &7打开该装备的规则选项 GUI。'
        - '&f/%command% bind [装备] &e- &7打开该装备的竞技场绑定 GUI。'
        - '&f/%command% list &e- &7列出所有装备。'
        - '{HALF_LINE} &f装备命令 {HALF_LINE}'
      queue:
        - '{HALF_LINE} &f队列告示牌命令 {HALF_LINE}'
        - '&f/%command% createqueue [押注] [-|装备] &e- &7创建一个指定押注和装备的队列。'
        - '&f/%command% deletequeue &e- &7删除指定押注和装备的队列。'
        - '&f/%command% list &e- &7列出可用队列。'
        - '{HALF_LINE} &f队列告示牌命令 {HALF_LINE}'
      sign:
        - '{HALF_LINE} &f队列告示牌命令 {HALF_LINE}'
        - '&f/%command% addsign [押注] [-|装备] &e- &7创建一个指定押注和装备的队列告示牌。'
        - '&f/%command% delsign &e- &7删除你看的那块队列告示牌。'
        - '&f/%command% list &e- &7列出队列告示牌。'
        - '{HALF_LINE} &f队列告示牌命令 {HALF_LINE}'
      user:
        - '{HALF_LINE} &f玩家数据编辑命令 {HALF_LINE}'
        - '&f/%command% setrating [名字] [-|装备] [数值] &e- &7设置玩家在某装备下的评分。'
        - '&f/%command% edit [名字] [add|remove|set] [wins|losses] [数值] &e- &7修改玩家胜/败场。'
        - '&f/%command% resetrating [名字] [-|kit|all] &e- &7重置玩家某装备或全部评分。'
        - '&f/%command% reset [名字] &e- &7重置玩家决斗数据。'
        - '{HALF_LINE} &f玩家数据编辑命令 {HALF_LINE}'
      extra:
        - '{HALF_LINE} &f其他命令 {HALF_LINE}'
        - '&f/%command% setlobby &e- &7设置决斗大厅位置。'
        - '&f/%command% lobby &e- &7传送到决斗大厅。'
        - '&f/%command% playsound [名字] &e- &7播放配置中定义的音效。'
