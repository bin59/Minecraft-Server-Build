# ============================================
# AuctionHouse 语言文件 — 简体中文 (zh_CN)
# ============================================
#
# 格式：MiniMessage 标签（<red>、<green>、<gold>、<gray>、<white> 等）
# 兼容旧版 '&' 颜色代码。占位符用 {name} 格式。
# 在 config.yml 里设置 "language: zh_CN" 切换语言。
# 缺失的 key 会自动回退到 en_US。
#
# 声音：在任意消息 key 旁加 "-sound" key 可播放音效。
# 示例：auction-bought-sound: ENTITY_EXPERIENCE_ORB_PICKUP
# 设为 "" 或 "NONE" 关闭，使用 Bukkit Sound 枚举名。
# ============================================

# ─── 前缀 ─────────────────────────────────────────────
prefix: "<dark_gray>[<gold>拍卖行<dark_gray>] "

# ─── 通用错误 ───────────────────────────────────────────
no-permission: "<red>你没有权限这么做。"
player-only: "<red>此命令只能由玩家使用。"
invalid-args: "<red>参数无效。输入 <white>/ah help<red> 查看命令。"
invalid-price: "<red>价格无效，必须是数字。"
invalid-id: "<red>拍卖 ID 无效，必须是数字。"
invalid-number: "<red>数字无效。"
invalid-amount: "<red>数量无效，必须在 1 到 <white>{max}<red> 之间。"
hold-item: "<red>你必须手持要出售的物品。"
inventory-full: "<red>你的背包已满！"
module-disabled: "<red>此功能当前已关闭。"
no-economy: "<red>未找到经济插件，拍卖行已禁用。"
world-restricted: "<red>此世界不能使用拍卖行。"
invalid-material: "<red>物品类型无效：<white>{item}"
no-auctions: "<gray>当前没有上架的拍卖。"
items-dropped-at-feet: "<gold>溢出的物品已掉落在你脚边。"
item-blacklisted: "<red>此物品不能上架拍卖行。"
item-blacklisted-container: "<red>此容器含有黑名单物品（<white>{item}<red>），不能上架。"
creative-blocked: "<red>创造模式下不能出售物品。"

# ─── 用法提示 ───────────────────────────────────────────
usage-sell: "<red>用法：<white>/ah sell <价格> [数量]"
usage-cancel: "<red>用法：<white>/ah cancel <ID>"
usage-search: "<red>用法：<white>/ah search <关键词>"
usage-admin: "<red>用法：<white>/ah admin [reload|transactions|lookup|purge|stats|forcecancel|return|import]"

