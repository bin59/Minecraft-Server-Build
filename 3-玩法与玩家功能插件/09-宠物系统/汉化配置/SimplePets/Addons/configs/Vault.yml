# 禁用此项会让物品显示价格，但如果玩家拥有跳过付费权限则无需付费
# 默认: true
Hide-Price-If-Bypassed: true

# 玩家每次召唤宠物时是否需要付费？
# 默认: false
Pay-Per-Use-Enabled: false
Price:
  # 宠物免费时，此文本会替代 lore 中的价格位置
  # 默认: 'Free'
  Free: 免费
  # 玩家拥有跳过权限时，此文本会替代 lore 中的价格位置
  # 默认: 'BYPASSED'
  Bypassed: 已豁免

# 这里可以为两个布尔值（true/false）设置翻译
Boolean:
  'true': '&#92fc98是'
  'false': '&#fa7d7d否'
Messages:
  prefix: '&e简易宠物 &6>>'
  PurchaseSuccessful:
    # 购买成功时发送此消息
    # 占位符：
    # - {prefix}（使用自定义前缀）
    # - {type}（宠物的类型）
    # - {price}（宠物的价格）
    One-Time-Purchase: '{prefix} &7你已成功购买 {type} 宠物。'
    # 购买成功时发送此消息（当 Pay-Per-Use 设为 true 时）
    # 占位符：
    # - {prefix}（使用自定义前缀）
    # - {type}（宠物的类型）
    # - {price}（宠物的价格）
    Pay-Per-Use: '{prefix} &7你已成功支付 {type} 宠物的费用。'
  # 玩家余额不足时发送此消息
  # 占位符：
  # - {prefix}（使用自定义前缀）
  # - {type}（宠物的类型）
  # - {price}（宠物的价格）
  InsufficientFunds: '{prefix} &c你的余额不足以购买这只宠物，还需要 {price}'
  Lore-Lines:
    # 这些 lore 行仅在 'Pay-Per-Use' 设为 false 时使用
    # 占位符：
    # - {price}（宠物的价格）
    # - {purchased}（玩家是否已购买该宠物，true/false）
    One-Time-Purchase:
      - '&#ffbf5e价格: &#99ffac{price}'
      - '&#ffbf5e已购买: {purchased}'
    # 打开 GUI 时这些行会被添加到宠物物品上
    # 占位符：
    # - {price}（宠物的价格）
    # - {purchased}（玩家是否已购买该宠物，true/false）
    Pay-Per-Use:
      - '&#ffbf5e价格: &#99ffac{price}'
