const STATS = {"PumpkinVegetable": {"count": 594, "dist": 252988, "xmin": -83, "xmax": 7072, "zmin": -70, "zmax": 9414, "tmin": 1789496492415, "tmax": 1789808873376}, "Pumpkin_V": {"count": 13, "dist": 99, "xmin": -13, "xmax": 43, "zmin": 27, "zmax": 94, "tmin": 1789753379705, "tmax": 1789803920379}};
const PLAYERS = ["PumpkinVegetable", "Pumpkin_V"];
const T0 = 1789496492415, T1 = 1789808873376;
const COLORS = { "PumpkinVegetable":"#4ade80", "Pumpkin_V":"#60a5fa" };

// overall stats
let totalPts=0, totalDist=0;
PLAYERS.forEach(n=>{ totalPts+=STATS[n].count; totalDist+=STATS[n].dist; });
document.getElementById('c-players').textContent = PLAYERS.length;
document.getElementById('c-points').textContent = totalPts;
document.getElementById('c-dist').textContent = totalDist.toLocaleString();
const fmt = t => new Date(t).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
document.getElementById('c-time').textContent = fmt(T0)+' ~ '+fmt(T1);
document.getElementById('tmin').textContent = fmt(T0);
document.getElementById('tmax').textContent = fmt(T1);

// legend
const visible = {}; PLAYERS.forEach(n=>visible[n]=true);
const lg = document.getElementById('legend');
PLAYERS.forEach(n=>{
  const el=document.createElement('div'); el.className='lg';
  el.innerHTML='<span class="dot" style="background:'+(COLORS[n]||'#aaa')+'"></span>'+n;
  el.onclick=()=>{ visible[n]=!visible[n]; el.classList.toggle('off',!visible[n]); render(); };
  lg.appendChild(el);
});

const chart = echarts.init(document.getElementById('chart'),'dark');
const slider = document.getElementById('slider');
let playTimer=null;

function cutoff(){ return T0 + (T1-T0)*(slider.value/1000); }

function buildSeries(){
  const cut = cutoff();
  const series=[];
  PLAYERS.forEach(name=>{
    if(!visible[name]) return;
    const pts = TRACK[name].filter(p=>p[2]<=cut);
    if(pts.length===0) return;
    const color = COLORS[name]||'#aaa';
    // trail line
    series.push({
      name:name+' 轨迹', type:'line',
      showSymbol:false, data: pts.map(p=>[p[0],p[1]]),
      lineStyle:{color:color,width:1.6,opacity:.85}, z:2
    });
    // current point
    const last=pts[pts.length-1];
    series.push({
      name:name+' 当前', type:'effectScatter',
      data:[[last[0],last[1]]], symbolSize:11,
      itemStyle:{color:color,borderColor:'#fff',borderWidth:1}, z:5,
      rippleEffect:{scale:2.5}
    });
    // start point
    series.push({
      name:name+' 起点', type:'scatter',
      data:[[pts[0][0],pts[0][1]]], symbolSize:8,
      itemStyle:{color:'transparent',borderColor:color,borderWidth:2}, z:4
    });
  });
  return series;
}

function render(){
  const cut = cutoff();
  document.getElementById('tnow').textContent = fmt(cut);
  chart.setOption({
    backgroundColor:'transparent',
    grid:{left:60,right:30,top:30,bottom:50},
    xAxis:{name:'X',scale:true,axisLine:{lineStyle:{color:'#444'}},splitLine:{lineStyle:{color:'#232a35'}},axisLabel:{color:'#9aa3b2'}},
    yAxis:{name:'Z',scale:true,inverse:true,axisLine:{lineStyle:{color:'#444'}},splitLine:{lineStyle:{color:'#232a35'}},axisLabel:{color:'#9aa3b2'}},
    tooltip:{formatter:p=>'('+p.value[0]+', '+p.value[1]+')'},
    series: buildSeries()
  }, true);
}

slider.oninput = ()=>{ stopPlay(); render(); };

const btn=document.getElementById('btn');
function stopPlay(){ if(playTimer){clearInterval(playTimer);playTimer=null;btn.textContent='▶ 播放';} }
btn.onclick=()=>{
  if(playTimer){ stopPlay(); return; }
  if(slider.value>=1000) slider.value=0;
  btn.textContent='⏸ 暂停';
  playTimer=setInterval(()=>{
    let v=+slider.value+8;
    if(v>=1000){ v=1000; slider.value=v; render(); stopPlay(); return; }
    slider.value=v; render();
  },60);
};

window.addEventListener('resize',()=>chart.resize());
render();
</script>
