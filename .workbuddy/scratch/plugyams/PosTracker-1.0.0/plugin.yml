name: PosTracker
main: com.risefall.tracker.Plugin
version: 1.0-0
api-version: 1.15

commands:
  pos:
    description: "Command for retrieving player position data and managing plugin settings."
    usage: "/pos help"
    permission: postracker.admin
    permission-message: "You do not have permission to use this command."

permissions:
  postracker.admin:
    description: "Allows use of all PosTracker commands."
    default: op
