############################################################
# QuickMenu — 双轨快捷菜单配置文件（全插件整合版）
#
# Java 玩家 → 箱子 GUI（下方 items 定义图标与槽位）
# 基岩玩家 → 原生 Form 表单（按 items 顺序生成按钮）
#
# 修改后执行 /qm reload 即时生效，无需重启服务器
#
# ============================================================
# 菜单总览（20 套，分「玩家」与「管理」两条线）
# ============================================================
#
# 【玩家线】所有人可见，default-menu 指向 main
#   main          主菜单（一级入口）
#   teleport      传送功能     EssentialsX + BedrockPlayerSupport
#   home          我的家园     EssentialsX + BedrockPlayerSupport
#   residence     我的领地     Residence
#   economy       经济中心     EssentialsX + Vault
#   kit           工具包       EssentialsX
#   skin          皮肤管理     SkinsRestorer
#   social        社交设置     EssentialsX + EasyBot
#   info          服务器信息   EssentialsX
#   voice         语音聊天     Simple Voice Chat
#
# 【管理线】入口在 main 菜单，靠 permission: quickmenu.admin 门控，
#           普通玩家看不到、也点不到；管理员也可直接 /qm open admin
#   admin           管理面板（一级入口）
#   admin-player    玩家管理     OpenInv + EssentialsX
#   admin-punish    处罚管理     EssentialsX
#   admin-teleport  传送管理     EssentialsX
#   admin-residence 领地管理     Residence
#   admin-inspect   审计回滚     CoreProtect
#   admin-world     世界管理     Chunky + WorldEdit + 原版
#   admin-server    服务器监控   spark + Geyser + ViaVersion + EasyBot
#   admin-perm      权限管理     LuckPerms
#   admin-qm        菜单管理     QuickMenu 自身
#
# ============================================================
# 重要：为什么大量菜单项是「文字指引」而不是直接执行
# ============================================================
# 本插件只有「按钮列表」，没有输入框，无法在玩家点击后询问「对谁执行」。
# 因此凡是需要带玩家名 / 领地名 / 金额等参数的指令（如 /kick 玩家名），
# 统一做成：关闭界面 + 发送指令用法提示，让管理员手动补参数。
# 这类项在 lore 里都标了「需手动补充参数」。
# 不需要参数的（如 /fly /heal /spark tps）则直接执行。
############################################################

# ==================== 基础设置 ====================

# 调试模式：开启后在控制台输出菜单分发、表单点击等详细日志
debug: false

# 玩家直接输入 /qm 时打开的默认菜单 id
default-menu: main

# ==================== 平台策略 ====================

platform:
  # 基岩玩家是否优先使用原生 Form 表单（强烈建议 true）
  # 设为 false 则基岩玩家也用箱子界面，但会遇到 Geyser 的已知缺陷：
  # 物品可被拖出掉地、移动端高亮异常、触屏只能左键等
  bedrock-native-form: true

  # Java 玩家是否使用箱子 GUI
  java-chest-gui: true

# ==================== 触发物品 ====================

trigger-item:
  # 物品材质，使用 Bukkit Material 名称（大写）
  material: CLOCK

  # 物品显示名（支持 & 颜色码）
  name: '&6&l快捷菜单'

  # 物品描述（支持 & 颜色码）
  lore:
    - '&7右键打开快捷菜单'
    - '&8Java 玩家看到箱子界面'
    - '&8基岩玩家看到原生表单'
    - '&8管理员可在菜单内进入管理面板'

  # 是否让物品发光（使用附魔光效，不产生任何实际属性加成）
  glowing: true

  # 玩家进服时是否自动发放该物品
  # 基岩服建议 true —— 手机玩家翻物品栏比打指令快
  give-on-join: true

  # 发放到背包的第几个格子（0-35，8 为快捷栏最后一格）
  # 设为 -1 表示自动寻找空位
  give-slot: 8

  # 严格匹配模式：true 时只有本插件发放的物品才能触发菜单
  # （通过 PersistentDataContainer 标记识别，玩家自制同名物品无效）
  # 设为 false 则按材质+名称匹配，便于用 /give 自制触发物品
  strict-match: true

# ==================== 音效 ====================

sound:
  # 点击菜单项时的音效名（使用字符串形式，跨版本升级不会失效）
  # 留空字符串 '' 表示不播放音效
  click: 'ui.button.click'
  click-volume: 0.6
  click-pitch: 1.0

# ==================== 消息文本 ====================

messages:
  no-permission: '&c你没有权限使用快捷菜单'
  no-admin-permission: '&c你需要管理员权限'
  menu-not-found: '&c菜单 &e{menu} &c不存在'
  player-not-found: '&c找不到玩家 &e{player}'
  specify-player: '&c控制台执行时必须指定玩家名'
  inventory-full: '&c{player} 的背包已满'
  trigger-item-give-full: "&c背包已满，无法获取\u201C快捷菜单\u201D时钟，请用 /qm 打开快捷菜单"
  trigger-item-upgraded: "&a检测到旧版触发物品，已自动升级为\u201C快捷菜单\u201D时钟"
  give-success: '&a已发放快捷菜单物品给 &e{player}'
  reload-success: '&a配置已重载，共加载 &e{count} &a个菜单'
  no-menus: '&c尚未加载任何菜单'
  console-not-allowed: '&c该命令只能由玩家执行'
  unknown-subcommand: '&c未知子命令，使用 /qm 查看帮助'
  chest-gui-disabled: '&c箱子菜单已被禁用'
  item-drop-denied: '&c快捷菜单物品不能丢弃，使用 /qm 即可打开菜单'

# ==================== 玩家选择器（选人界面） ====================
# 用于 [player-selector] 动作（如申请传送到玩家 / 请求玩家过来）。
# 点击菜单项后动态列出全部在线玩家，玩家再点选目标即可执行命令，
# 无需再手动输入玩家名。Java 端显示为箱子界面（玩家头颅），
# 基岩端显示为原生表单按钮列表。

player-selector:
  # 界面标题（支持 & 颜色码）
  title: '&6&l选择玩家'
  # 基岩表单的正文说明（Java 箱子界面不显示）
  content: '请选择要传送的玩家'
  # 每个玩家头颅下的说明文字
  lore: '&7点击向 TA 发送传送请求'
  # 没有其他在线玩家时显示的提示
  no-players: '&c当前没有其他在线玩家'

############################################################
# 菜单定义
#
# 每个菜单的字段说明：
#   title           界面标题（两端通用，支持 & 颜色码）
#   bedrock-content 基岩表单标题下方的说明文字（留空则用 title）
#   size            箱子界面容量，必须是 9 的倍数，范围 9~54
#   back-menu       上级菜单 id，配置后会显示返回按钮（固定在右下角 size-1）
#   filler          箱子界面空白处的填充物品
#   items           菜单项列表
#
# 每个菜单项的字段说明：
#   material      物品材质（仅 Java 箱子界面使用）
#   display-name  物品显示名（两端通用）
#   lore          物品描述行（仅 Java 箱子界面使用）
#   slot          所在格子序号，从 0 开始（仅 Java 箱子界面使用）
#                 注意：配了 back-menu 的菜单，右下角 size-1 是返回按钮专用
#   glowing       是否发光
#   permission    需要的权限节点，留空表示所有人可见
#                 无权限的项会被跳过，基岩端按钮序号自动重排
#   button-label  基岩表单按钮文本（可选，留空=自动用 display-name 去色）
#   actions       点击后执行的动作列表
#
# actions 动作类型：
#   [player] 命令      以玩家身份执行（受权限系统约束），不含斜杠
#   [console] 命令     以控制台身份执行（无视权限），不含斜杠
#   [menu] 菜单id      打开另一个菜单
#   [message] 文本     发送消息，支持 & 颜色码
#   [close]            关闭界面/表单
#   不带前缀的命令      等同于 [player]
#
# 平台条件动作（两端需要调用不同指令时用）：
#   [bedrock-player] 命令    仅基岩玩家，玩家身份
#   [java-player] 命令       仅 Java 玩家，玩家身份
#   [bedrock-console] 命令   仅基岩玩家，控制台身份
#   [java-console] 命令      仅 Java 玩家，控制台身份
############################################################

