# =========================================================
# AdvZone 配置
# =========================================================
# 选点魔棒：手持该物品，站在拐角处 左键=加一个顶点，右键=撤销上一个顶点
# （顶点会显示粒子柱，方便对位）。也可以用命令 /az add、/az undo、/az points 管理。
# 推荐流程：/az wand → 沿着不规则边缘逐个拐角左键 → /az create <名字>
wand-material: ARROW

# 区域可以完全在游戏内用 /az create <名字> 创建并自动写回本文件，无需手动编辑。
# 不规则形状 = 多边形顶点连线，按顺序自动闭合；
# 不连片的形状就分多个区域（regions 下多个键）。
# y-min / y-max：区域垂直范围，超出不触发（-64 是 1.18+ 世界最低层）。

regions:
  safezone:
    y-min: -64
    y-max: 320
    points:
      - "100,200"
      - "300,210"
      - "320,400"
      - "90,380"
